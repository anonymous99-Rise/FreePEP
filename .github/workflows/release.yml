name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v2026-09-10)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: FreePEP-Windows-x64
          - os: ubuntu-latest
            target: linux
            artifact: FreePEP-Linux-x64
          - os: macos-latest
            target: macos
            artifact: FreePEP-macOS-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget gnupg xvfb libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2 libnss3

      - name: Install Python deps
        run: |
          pip install --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/ -r requirements.txt
          pip install --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/ pyinstaller playwright
          playwright install --with-deps chromium

      - name: Build Windows exe
        if: matrix.target == 'windows'
        run: python build_exe.py

      - name: Build Linux
        if: matrix.target == 'linux'
        run: python build_linux.py

      - name: Build macOS
        if: matrix.target == 'macos'
        run: python build_macos.py

      - name: Package Linux / macOS
        if: matrix.target != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          PLATFORM_NAME=${{ matrix.target == 'macos' && 'macOS' || matrix.target }}
          tar -czf dist/FreePEP-${PLATFORM_NAME}-x64.tar.gz -C dist FreePEP

      - name: Find built artifacts
        id: find_artifact
        shell: bash
        run: |
          PLATFORM_NAME=${{ matrix.target == 'macos' && 'macOS' || matrix.target }}
          echo "path=dist/FreePEP-${PLATFORM_NAME}-x64.${{ matrix.target == 'windows' && 'zip' || 'tar.gz' }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.find_artifact.outputs.path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract tag version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" == "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if grep -q "## $TAG" CHANGELOG.md; then
            # Extract section until next ## or end of file
            sed -n "/## $TAG/,/^## /p" CHANGELOG.md | sed '$d' | sed '1d' > release_notes.md
          else
            echo "*(无详细更新日志)*" > release_notes.md
          fi

      - name: Read release notes
        id: release_notes
        run: |
          NOTES=$(cat release_notes.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## 更新内容" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "**课本更新时间：${{ steps.version.outputs.version }}**" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "完整更新日志请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FreePEP v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            artifacts/FreePEP-Windows-x64/FreePEP-Windows-x64.zip
            artifacts/FreePEP-Linux-x64/FreePEP-Linux-x64.tar.gz
            artifacts/FreePEP-macOS-x64/FreePEP-macOS-x64.tar.gz
