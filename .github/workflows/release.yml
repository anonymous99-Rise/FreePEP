name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.2.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: FreePEP-Windows-x64
          - os: ubuntu-latest
            target: linux
            artifact: FreePEP-Linux-x64
          - os: macos-latest
            target: macos
            artifact: FreePEP-macOS-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget gnupg xvfb libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libasound2 libpango-1.0-0 libcairo2 libnss3

      - name: Install Python deps
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pyinstaller playwright
          playwright install --with-deps chromium

      - name: Build Python deps (alibaba mirror)
        if: matrix.target == 'linux'
        run: |
          pip install --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/ -r requirements.txt
          pip install --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/ pyinstaller playwright
          playwright install --with-deps chromium

      - name: Build Windows exe
        if: matrix.target == 'windows'
        run: python build_exe.py

      - name: Build Linux / macOS
        if: matrix.target != 'windows'
        run: |
          pip install pyinstaller
          playwright install --with-deps chromium
          python build_exe.py

      - name: Find built artifacts
        id: find_artifact
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "windows" ]; then
            echo "path=dist/FreePEP-Windows-x64.zip" >> $GITHUB_OUTPUT
            echo "dir=dist/FreePEP" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.target }}" == "linux" ]; then
            echo "path=dist/FreePEP-Linux-x64.tar.gz" >> $GITHUB_OUTPUT
            echo "dir=dist/FreePEP" >> $GITHUB_OUTPUT
          else
            echo "path=dist/FreePEP-macOS-x64.tar.gz" >> $GITHUB_OUTPUT
            echo "dir=dist/FreePEP" >> $GITHUB_OUTPUT
          fi

      - name: Package Linux / macOS
        if: matrix.target != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/FreePEP-${{ matrix.target == 'macos' && 'macOS' || matrix.target }}-x64.tar.gz -C dist FreePEP

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.find_artifact.outputs.path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$TAG" ] || [ "$TAG" == "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "tag_exists=true" >> $GITHUB_OUTPUT

      - name: Create/Update GitHub Release
        if: steps.version.outputs.tag_exists == 'false'
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FreePEP ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/FreePEP-Windows-x64/FreePEP-Windows-x64.zip
            artifacts/FreePEP-Linux-x64/FreePEP-Linux-x64.tar.gz
            artifacts/FreePEP-macOS-x64/FreePEP-macOS-x64.tar.gz
